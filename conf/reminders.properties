# Cấu hình tính năng Lời nhắc & Trò chuyện cho Shimeji (Linux)
enabled=true
soundEnabled=true
notifySendEnabled=false
randomIdleChatEnabled=true
randomChatIntervalMinutes=15
bubbleDurationSeconds=7

# Scheduled Reminders (Lịch nhắc nhở cố định theo giờ HH:mm)
reminder.11_55=11h55 rồi, anh đi ăn cơm trưa thôi nào! 🍚🍛
reminder.12_00=12h00 rồi, nghỉ ngơi một lát cho khỏe nhé anh! 💤
reminder.14_00=Bắt đầu buổi chiều tràn đầy năng lượng nào! ⚡
reminder.17_30=Hết giờ làm việc rồi, chuẩn bị nghỉ ngơi thôi anh! 🎉
reminder.23_00=Đã 23h00 rồi, ngủ sớm giữ gìn sức khỏe nha anh! 🌙

# Interval Reminders (Nhắc nhở theo chu kỳ phút)
interval.water_minutes=60
interval.water_message=Anh nhớ uống một ngụm nước nhé! 💧
interval.rest_minutes=45
interval.rest_message=Anh chớp mắt và vươn vai thư giãn 20 giây nha! 👀
